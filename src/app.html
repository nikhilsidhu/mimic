<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mimic</title>
    <!-- Before the first paint, so a light theme never flashes dark. Mirrors `lib/theme.ts`. -->
    <script>
      (function () {
        var theme = localStorage.getItem("theme") || "dark";
        var dark = theme === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : theme !== "light";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("black", theme === "black");
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
