name: Release

# Pushing a tag like v0.1.0 builds the installer and attaches it to a draft release.
# Installed copies only see the update once the draft is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build and sign the installer
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json
        env:
          # The updater only accepts installers signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Describe the update
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # What installed copies fetch to learn about this version.
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$bundle/*-setup.exe" | Select-Object -First 1
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "the tag ${{ github.ref_name }} does not match version $version in tauri.conf.json"
          }
          @{
            version   = $version
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content "$bundle/latest.json" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: mimic-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/latest.json
